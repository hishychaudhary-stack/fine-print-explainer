<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Analysis Results</h1>

    {% for title, desc, risk in results %}
        <div class="card {{ risk }}">
            <h3>{{ title }}</h3>
            <p>{{ desc }}</p>
            <strong>Risk: {{ risk }}</strong>
        </div>
    {% endfor %}

    <br>
    <a href="/">Go Back</a>

</body>
</html>
