<!DOCTYPE html>
<html>
<head>
    <title>Analysis Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Analysis Results</h1>

        {% for title, desc, risk in results %}
            <div class="card {{ risk }}">
                <h3>{{ title }}</h3>
                <p>{{ desc }}</p>
                <strong>Risk: {{ risk }}</strong>
            </div>
        {% endfor %}

        <a class="back-link" href="/">Analyze Another Policy</a>
    </div>
</body>
</html>
